name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            dockerfile: Dockerfile
            suffix: ""
          - variant: kokoro
            dockerfile: Dockerfile.kokoro
            suffix: "-kokoro"
            build-args: KOKORO_ACCEL=cpu
          - variant: kokoro-cuda
            dockerfile: Dockerfile.kokoro
            suffix: "-kokoro-cuda"
            build-args: KOKORO_ACCEL=cuda

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=${{ github.run_id }}

      - name: Compute cache options
        id: cache
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # PR-branch GHA caches are evicted after 7 days, but their manifests
          # keep referencing the missing blobs, which fails buildx on import.
          # Only reuse (and refresh) the cache from push builds on main.
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            echo "cache-from=type=gha,scope=${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
            echo "cache-to=type=gha,mode=max,scope=${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "cache-from=" >> "$GITHUB_OUTPUT"
            echo "cache-to=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
