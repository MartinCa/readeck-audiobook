<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Readeck Audiobook{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
<nav>
  <span class="brand">📻 Readeck Audiobook</span>
  <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Bookmarks</a>
  <a href="/jobs" {% if request.url.path == "/jobs" %}class="active"{% endif %}>Jobs</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
