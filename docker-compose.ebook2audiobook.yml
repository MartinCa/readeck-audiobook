# Compose override that swaps the readeck-audiobook image for the variant bundling
# ebook2audiobook (see Dockerfile.ebook2audiobook), instead of running it as a
# separate service reached over an HTTP API it doesn't expose.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ebook2audiobook.yml up -d --build
# Then set TTS_ENGINE=ebook2audiobook in your .env.
#
# Requires the NVIDIA Container Toolkit on the host (default base image is the CUDA
# build). For CPU/ROCm hosts, build with:
#   docker compose -f docker-compose.yml -f docker-compose.ebook2audiobook.yml build \
#     --build-arg E2A_BASE_IMAGE=docker.io/athomasson2/ebook2audiobook:cpu
# and drop the `deploy` block below.
services:
  readeck-audiobook:
    build:
      context: .
      dockerfile: Dockerfile.ebook2audiobook
    environment:
      TTS_ENGINE: ebook2audiobook
    volumes:
      - e2a_models:/app/models      # cache downloaded TTS models (~GB)
      - e2a_voices:/app/voices      # custom voice files (optional)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  e2a_models:
  e2a_voices:
