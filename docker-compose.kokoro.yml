# Standalone compose file for the Kokoro-82M TTS variant, using the pre-built image
# published by CI (see .github/workflows/publish.yml) rather than building
# Dockerfile.kokoro locally.
#
# Usage:
#   cp .env.example .env   # fill in READECK_BASE_URL / READECK_API_TOKEN
#   docker compose -f docker-compose.kokoro.yml up -d
#
# Pin a specific released version instead of `latest-kokoro` via .env:
#   READECK_AUDIOBOOK_IMAGE=ghcr.io/martinca/readeck-audiobook:1.2.0-kokoro
#
# Uses the NVIDIA Container Toolkit for GPU acceleration (Kokoro falls back to CPU
# automatically if no GPU is available — drop the `deploy` block below to force CPU-only).
services:
  readeck-audiobook:
    image: ${READECK_AUDIOBOOK_IMAGE:-ghcr.io/martinca/readeck-audiobook:latest-kokoro}
    ports:
      - "8080:8080"
    environment:
      READECK_BASE_URL: ${READECK_BASE_URL}
      READECK_API_TOKEN: ${READECK_API_TOKEN}
      TTS_ENGINE: kokoro
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-en-US-AriaNeural}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
    volumes:
      - audio_data:/app/audio
      - db_data:/app/data
      - kokoro_models:/app/models   # cache downloaded Kokoro model weights
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  audio_data:
  db_data:
  kokoro_models:
