services:
  readeck-audiobook:
    build: .
    ports:
      - "8080:8080"
    environment:
      READECK_BASE_URL: ${READECK_BASE_URL}
      READECK_API_TOKEN: ${READECK_API_TOKEN}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-en-US-AriaNeural}
      TTS_ENGINE: ${TTS_ENGINE:-edge-tts}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      # Unauthenticated unless both are set — see README.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    volumes:
      - audio_data:/app/audio
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  audio_data:
  db_data:
