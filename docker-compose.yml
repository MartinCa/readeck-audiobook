services:
  readeck-audiobook:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      ebook2audiobook:
        condition: service_healthy
        required: false   # ignored when the ebook2audiobook profile is not active
    environment:
      READECK_BASE_URL: ${READECK_BASE_URL}
      READECK_API_TOKEN: ${READECK_API_TOKEN}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-en-US-AriaNeural}
      TTS_ENGINE: ${TTS_ENGINE:-edge-tts}
      EBOOK2AUDIOBOOK_URL: ${EBOOK2AUDIOBOOK_URL:-http://ebook2audiobook:7860}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
    volumes:
      - audio_data:/app/audio
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: high-quality neural TTS via ebook2audiobook.
  # Enable with:  docker compose --profile ebook2audiobook up
  # Then set TTS_ENGINE=ebook2audiobook in your .env
  ebook2audiobook:
    image: athomasson2/ebook2audiobook:cpu
    profiles:
      - ebook2audiobook
    ports:
      - "7860:7860"      # Gradio web UI — accessible at http://localhost:7860
    volumes:
      - e2a_models:/app/models      # cache downloaded TTS models (~GB)
      - e2a_voices:/app/voices      # custom voice files (optional)
      - e2a_ebooks:/app/ebooks      # staging area for input EPUBs
      - e2a_audiobooks:/app/audiobooks  # ebook2audiobook's own output dir
    healthcheck:
      # Gradio serves HTTP on 7860; Python is always available in the image
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:7860/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s  # first run downloads multi-GB models
    restart: unless-stopped

volumes:
  audio_data:
  db_data:
  e2a_models:
  e2a_voices:
  e2a_ebooks:
  e2a_audiobooks:
